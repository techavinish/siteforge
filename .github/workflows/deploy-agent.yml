name: deploy agent

on:
  push:
    branches: [main]
    paths: ["services/agent/**"]

permissions:
  id-token: write
  contents: read

env:
  IMAGE: asia-south1-docker.pkg.dev/siteforge-dev-3977/services/agent

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/247435823944/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@siteforge-dev-3977.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - run: docker build -t "$IMAGE:${{ github.sha }}" services/agent
      - run: docker push "$IMAGE:${{ github.sha }}"

      - run: |
          gcloud run deploy agent \
            --image "$IMAGE:${{ github.sha }}" \
            --region asia-south1 \
            --project siteforge-dev-3977
